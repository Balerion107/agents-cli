steps:
  # Pre-fetch Go modules with retries so a dropped module proxy connection
  # doesn't fail the build. Later steps reuse them via GOMODCACHE, which lives
  # in /workspace because that is the only directory shared between steps.
  - name: "golang:1.26"
    id: download-modules
    entrypoint: /bin/bash
    env:
      - "GOMODCACHE=/workspace/.gomodcache"
    args:
      - "-c"
      - |
        go mod download || (sleep 10 && go mod download) || (sleep 20 && go mod download)

  # Run unit tests
  - name: "golang:1.26"
    id: unit-tests
    entrypoint: /bin/bash
    env:
      - "GOMODCACHE=/workspace/.gomodcache"
    args:
      - "-c"
      - |
        go test -v ./...

  # Run integration tests
  - name: "golang:1.26"
    id: integration-tests
    entrypoint: /bin/bash
    env:
      - "GOMODCACHE=/workspace/.gomodcache"
      - "GOOGLE_CLOUD_PROJECT=${PROJECT_ID}"
      - "GOOGLE_CLOUD_LOCATION=global"
      - "GOOGLE_GENAI_USE_VERTEXAI=True"
    args:
      - "-c"
      - |
        go test -v -tags=e2e ./e2e/integration/... -short

logsBucket: gs://${PROJECT_ID}-{{ cookiecutter.project_name | replace('_', '-') }}-logs/build-logs
options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
