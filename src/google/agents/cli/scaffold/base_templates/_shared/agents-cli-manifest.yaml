name: '{{cookiecutter.project_name}}'
acli_version: '{{cookiecutter.package_version}}'
agent_directory: '{{cookiecutter.agent_directory}}'
region: 'us-east1'
base_template: '{{cookiecutter.recorded_base_template}}'
generated_at: '{{cookiecutter.generated_at}}'
language: '{{cookiecutter.language or "python"}}'
framework: '{{cookiecutter.framework}}'
create_params:
  # The ADK name of the root agent, as rendered into the agent source. Rename
  # the agent and you must change it in both places: telemetry reports this as
  # gen_ai.agent.name, and it is what agents-cli reports for the project.
  root_agent_name: '{{cookiecutter.root_agent_name}}'
  deployment_target: '{{cookiecutter.deployment_target}}'
  session_type: '{{cookiecutter.session_type or "none"}}'
  cicd_runner: '{{cookiecutter.cicd_runner}}'
  {% if cookiecutter.is_a2a -%}
  is_a2a: true
  {%- endif %}
  agent_gateway: {{cookiecutter.agent_gateway}}
  agent_guidance_filename: '{{cookiecutter.agent_guidance_filename}}'
